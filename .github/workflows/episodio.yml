# Fábrica de videos de Ducki: cada corrida arma un video, lo manda al tema «Fábrica»
# del grupo de moderación en Telegram y termina. Los botones (Aprobar / Ajustar /
# Descartar) los recibe el bot de moderación en la API; un «Ajustar» vuelve aquí
# como repository_dispatch «fabrica-ajuste» con el episodio y el texto.
name: Episodio

on:
  schedule:
    # 11:00 UTC = 6:00 en Bogotá: el guion del día (y la imagen nueva) llega por la mañana
    - cron: '0 11 * * *'
    # lunes 10:30 UTC = 5:30 en Bogotá: el plan de la semana (7 ideas)
    - cron: '30 10 * * 1'
  workflow_dispatch:
    inputs:
      encargo:
        description: 'Encargo (vacío: el guionista elige el tema del día)'
        required: false
      formato:
        description: 'Formato (vacío: lista-scrapbook)'
        required: false
      prueba:
        description: 'Render de prueba con una voz ya hecha (sin gastar llaves de IA)'
        type: boolean
        default: false
      plan:
        description: 'Proponer ahora el plan de la semana'
        type: boolean
        default: false
      imagen:
        description: 'Generar ahora la imagen del día (si queda cupo)'
        type: boolean
        default: false
  repository_dispatch:
    # fabrica-voz: someone replied to the script with the audio (file_id from Telegram)
    # fabrica-generar: the script was approved; ElevenLabs voices it and the video is built
    # fabrica-plan-ajuste: change one idea of the weekly plan; fabrica-imagen: an AI image approved or discarded
    types: [fabrica-encargo, fabrica-ajuste, fabrica-voz, fabrica-generar, fabrica-plan-ajuste, fabrica-imagen]

# one at a time: each run commits its episode back to the repo
concurrency:
  group: fabrica
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  episodio:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: promo
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # without an API key, the script is written through Claude Code with the
      # Pro subscription token (`claude setup-token`)
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_TOPIC_FABRICA: ${{ secrets.TELEGRAM_TOPIC_FABRICA }}
      FABRICA_MODELO: ${{ vars.FABRICA_MODELO }}
      FABRICA_ESFUERZO: ${{ vars.FABRICA_ESFUERZO }}
      # manual (default): the script goes to Telegram and the team sends the voice;
      # eleven: ElevenLabs API voices it (needs a paid plan for library voices)
      FABRICA_VOZ: ${{ vars.FABRICA_VOZ }}
      WHISPER_MODEL: small
      # read the app's code and keep the episodes private (fine-grained token: Contents read
      # on Alexis1661/Ducki, read & write on Alexis1661/ducki-fabrica-episodios)
      DUCKI_REPO_TOKEN: ${{ secrets.DUCKI_REPO_TOKEN }}
      # the app's numbers and the team's choices (API /fabrica)
      FABRICA_TOKEN: ${{ secrets.FABRICA_TOKEN }}
      # AI images with the production OpenAI key; at most this many a day
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FABRICA_IMAGENES_DIA: ${{ vars.FABRICA_IMAGENES_DIA }}
      SCHEDULE: ${{ github.event.schedule }}
    steps:
      - uses: actions/checkout@v5

      # the app's code (private repo Ducki), read-only, so the writer and the director
      # understand what a feature does and how it looks; only with DUCKI_REPO_TOKEN
      - name: Código de Ducki
        if: env.DUCKI_REPO_TOKEN != ''
        uses: actions/checkout@v5
        with:
          repository: Alexis1661/Ducki
          token: ${{ secrets.DUCKI_REPO_TOKEN }}
          path: ducki-app
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            mobile/src
            mobile/app.json
            Backend/internal
            docs
            README.md

      # the episodes (scripts, storyboards) live in a private repo: a script about a feature
      # not launched yet must not sit in this public one
      - name: Episodios privados
        if: env.DUCKI_REPO_TOKEN != ''
        working-directory: .
        run: |
          # if the token cannot reach the private repo, the run goes on with the public folder
          if git clone -q --depth 50 "https://x-access-token:${DUCKI_REPO_TOKEN}@github.com/Alexis1661/ducki-fabrica-episodios.git" /tmp/episodios; then
            rm -rf fabrica/episodios && mv /tmp/episodios fabrica/episodios
            git -C fabrica/episodios remote set-url origin "https://github.com/Alexis1661/ducki-fabrica-episodios.git"
            echo "EPISODIOS_PRIVADOS=1" >> "$GITHUB_ENV"
          else
            echo "::warning::DUCKI_REPO_TOKEN no tiene acceso a Alexis1661/ducki-fabrica-episodios (Contents: read and write); los episodios se guardan en este repo público"
          fi


      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: promo/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji > /dev/null
          pip install -q numpy scipy pillow
          npm ci --no-audit --no-fund
          npx remotion browser ensure
          npm install -g --no-audit --no-fund @anthropic-ai/claude-code@2.1.331

      # word timings of a voice sent by hand
      # also when generating: if the ElevenLabs model gives no timestamps, whisper finds them
      - name: Whisper
        if: github.event.action == 'fabrica-voz' || github.event.action == 'fabrica-generar'
        run: pip install -q faster-whisper

      - uses: actions/cache@v4
        if: github.event.action == 'fabrica-voz' || github.event.action == 'fabrica-generar'
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      # app captures show real users, so the public repo only has them encrypted
      - name: Capturas
        env:
          CAPTURAS_KEY: ${{ secrets.CAPTURAS_KEY }}
        working-directory: .
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:CAPTURAS_KEY \
            -in promo/capturas.tar.enc | tar -xf -

      # one new AI image a day for the director's catalog (never stops the video)
      - name: Imagen del día
        if: (github.event_name == 'schedule' && github.event.schedule == '0 11 * * *') || inputs.imagen
        continue-on-error: true
        run: node scripts/fabrica/imagenes.mjs generar

      - name: Armar y enviar
        id: armar
        env:
          EVENTO: ${{ github.event_name }}
          ACCION: ${{ github.event.action }}
          ENCARGO_MANUAL: ${{ inputs.encargo }}
          PRUEBA: ${{ inputs.prueba }}
          ENCARGO_BOT: ${{ github.event.client_payload.encargo }}
          FORMATO: ${{ github.event.client_payload.formato || inputs.formato }}
          EPISODIO: ${{ github.event.client_payload.episodio }}
          TEXTO: ${{ github.event.client_payload.texto }}
          ARCHIVO: ${{ github.event.client_payload.archivo }}
          IDEA: ${{ github.event.client_payload.idea }}
          IMAGEN: ${{ github.event.client_payload.imagen }}
          IMAGEN_ACCION: ${{ github.event.client_payload.accion }}
          PLAN: ${{ inputs.plan }}
          SOLO_IMAGEN: ${{ inputs.imagen }}
        run: |
          if { [ "$EVENTO" = "schedule" ] && [ "$SCHEDULE" = "30 10 * * 1" ]; } || [ "$PLAN" = "true" ]; then
            node scripts/fabrica/semana.mjs nueva
          elif [ "$SOLO_IMAGEN" = "true" ]; then
            echo "solo la imagen del día"
          elif [ "$EVENTO" = "repository_dispatch" ] && [ "$ACCION" = "fabrica-plan-ajuste" ]; then
            node scripts/fabrica/semana.mjs ajustar --idea "$IDEA" --texto "$TEXTO"
          elif [ "$EVENTO" = "repository_dispatch" ] && [ "$ACCION" = "fabrica-imagen" ]; then
            node scripts/fabrica/imagenes.mjs decidir --imagen "$IMAGEN" --accion "$IMAGEN_ACCION"
          elif [ "$EVENTO" = "repository_dispatch" ] && [ "$ACCION" = "fabrica-generar" ]; then
            node scripts/fabrica/ci.mjs generar --episodio "$EPISODIO"
          elif [ "$EVENTO" = "repository_dispatch" ] && [ "$ACCION" = "fabrica-voz" ]; then
            node scripts/fabrica/ci.mjs voz --episodio "$EPISODIO" --archivo "$ARCHIVO"
          elif [ "$EVENTO" = "repository_dispatch" ] && [ "$ACCION" = "fabrica-ajuste" ]; then
            node scripts/fabrica/ci.mjs ajuste --episodio "$EPISODIO" --texto "$TEXTO"
          elif [ "$PRUEBA" = "true" ]; then
            node scripts/fabrica/ci.mjs nuevo --spec ../fabrica/formatos/lista-scrapbook/prueba-crush.json \
              --voz ../fabrica/pruebas/3-formas/voz-windows.wav --palabras ../fabrica/pruebas/3-formas/palabras.json
          else
            ENCARGO="${ENCARGO_BOT:-$ENCARGO_MANUAL}"
            set -- nuevo
            [ -n "$FORMATO" ] && set -- "$@" --formato "$FORMATO"
            [ -n "$ENCARGO" ] && set -- "$@" --encargo "$ENCARGO"
            node scripts/fabrica/ci.mjs "$@"
          fi

      # no artifact: in a public repo anyone could download the unapproved
      # video; it only goes to the Telegram topic

      # the episodes, the weekly plan and the image queue (private repo when the token reaches it)
      - name: Guardar el episodio
        if: success()
        working-directory: .
        env:
          CARPETA: ${{ steps.armar.outputs.carpeta }}
        run: |
          MSG="${CARPETA:+episodio: $(basename "$CARPETA")}"
          MSG="${MSG:-fábrica: ${{ github.event.action || github.event_name }}}"
          if [ "$EPISODIOS_PRIVADOS" = "1" ]; then
            cd fabrica/episodios
            git config user.name "fabrica-bot"
            git config user.email "fabrica-bot@users.noreply.github.com"
            git add -A
            git diff --cached --quiet && exit 0
            git commit -q -m "$MSG"
            git pull -q --rebase "https://x-access-token:${DUCKI_REPO_TOKEN}@github.com/Alexis1661/ducki-fabrica-episodios.git" main
            git push -q "https://x-access-token:${DUCKI_REPO_TOKEN}@github.com/Alexis1661/ducki-fabrica-episodios.git" HEAD:main
          else
            git config user.name "fabrica-bot"
            git config user.email "fabrica-bot@users.noreply.github.com"
            # without the private repo, the episode stays here (forced: the folder is ignored)
            git add -f fabrica/episodios
            git diff --cached --quiet && exit 0
            git commit -q -m "$MSG"
            git pull -q --rebase && git push -q
          fi

      # the AI images (pending ones and the approved catalog) live in this public repo
      - name: Guardar las imágenes
        if: success()
        working-directory: .
        run: |
          git config user.name "fabrica-bot"
          git config user.email "fabrica-bot@users.noreply.github.com"
          # each path on its own: a missing one would make git add stage nothing at all
          for p in promo/public/generados fabrica/catalogo/generados.json; do [ -e "$p" ] && git add -A "$p"; done
          git diff --cached --quiet && exit 0
          git commit -q -m "imágenes generadas: ${{ github.event.action || github.event_name }}"
          git pull -q --rebase && git push -q

      - name: Avisar si falló
        if: failure()
        run: node scripts/fabrica/formato-telegram.mjs aviso "⚠️ La fábrica no pudo terminar (${{ github.event.action || github.event_name }}). Detalle en ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
